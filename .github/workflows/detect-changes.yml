name: Detect changes

on:
  workflow_call:
    inputs:
      force_all_services:
        default: false
        required: false
        type: boolean
      detect_unreleased_services:
        default: false
        required: false
        type: boolean
    outputs:
      matrix:
        value: ${{ jobs.detect.outputs.matrix }}
      services:
        value: ${{ jobs.detect.outputs.services }}
      workflows:
        value: ${{ jobs.detect.outputs.workflows }}

permissions: {}

jobs:
  detect:
    name: Detect file changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      services: ${{ steps.matrix.outputs.services }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Paths Changes Filter
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            auth:
              - 'services/auth-service/**'
            profile:
              - 'services/profile-service/**'
            workflows:
              - '.github/workflows/**'

      - name: Generate service matrix
        id: matrix
        env:
          AUTH_CHANGED: ${{ steps.filter.outputs.auth }}
          DETECT_UNRELEASED_SERVICES: ${{ inputs.detect_unreleased_services }}
          FORCE_ALL_SERVICES: ${{ inputs.force_all_services }}
          PROFILE_CHANGED: ${{ steps.filter.outputs.profile }}
        run: |
          if [ "$FORCE_ALL_SERVICES" = true ]; then
            matrix='{"include":[{"service":"auth-service"},{"service":"profile-service"}]}'
          else
            if [ "$DETECT_UNRELEASED_SERVICES" = true ]; then
              auth_tag="$(git tag --list 'auth-service-v*' --sort=-version:refname | head -n 1)"
              profile_tag="$(git tag --list 'profile-service-v*' --sort=-version:refname | head -n 1)"
              if [ -z "$auth_tag" ] || ! git diff --quiet "$auth_tag"..HEAD -- services/auth-service; then
                AUTH_CHANGED=true
              else
                AUTH_CHANGED=false
              fi
              if [ -z "$profile_tag" ] || ! git diff --quiet "$profile_tag"..HEAD -- services/profile-service; then
                PROFILE_CHANGED=true
              else
                PROFILE_CHANGED=false
              fi
            fi
            matrix="$(jq -cn --argjson auth "$AUTH_CHANGED" --argjson profile "$PROFILE_CHANGED" '
              {include: [
                if $auth then {service: "auth-service"} else empty end,
                if $profile then {service: "profile-service"} else empty end
              ]}
            ')"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "services=$([[ "$matrix" == '{"include":[]}' ]] && echo false || echo true)" >> "$GITHUB_OUTPUT"
