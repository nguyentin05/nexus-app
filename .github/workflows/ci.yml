name: Application CI

on:
  workflow_call:
    inputs:
      allow_format:
        default: true
        required: false
        type: boolean
      matrix:
        description: Changed service matrix
        required: true
        type: string

permissions: {}

jobs:
  format-code:
    name: Format changed services
    if: >-
      inputs.allow_format && 
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.NEXUS_CICD_BOT_TOKEN }}

      - name: astral-sh/setup-uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Format Python code
        env:
          MATRIX: ${{ inputs.matrix }}
        run: |
          while read -r service; do
            uvx ruff format "services/$service"
          done < <(jq -r '.include[].service' <<< "$MATRIX")

      - name: Git Auto Commit
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: "style(project): auto-format Python sources"
          commit_user_name: nexus-cicd-bot
          commit_user_email: ${{ secrets.NEXUS_CICD_BOT_EMAIL }}
          commit_author: nexus-cicd-bot <${{ secrets.NEXUS_CICD_BOT_EMAIL }}>

  lint-code:
    name: Lint Python (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix: ${{ fromJSON(inputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: ruff-action
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: services/${{ matrix.service }}

  lint-dockerfiles:
    name: Lint Dockerfile (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix: ${{ fromJSON(inputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Hadolint Action
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: services/${{ matrix.service }}/Dockerfile

  unit-tests:
    name: Run unit tests (${{ matrix.service }})
    needs: [lint-code, lint-dockerfiles]
    if: >-
      always() &&
      needs.lint-code.result == 'success' &&
      needs.lint-dockerfiles.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix: ${{ fromJSON(inputs.matrix) }}
      fail-fast: false
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: astral-sh/setup-uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run unit tests
        run: uv run python -m pytest tests/

  sast:
    name: Static Application Security Testing
    needs: [lint-code, lint-dockerfiles]
    if: >-
      always() &&
      needs.lint-code.result == 'success' &&
      needs.lint-dockerfiles.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.6
        with:
          languages: python
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.6

  build:
    name: Build container image (${{ matrix.service }})
    needs: [unit-tests, sast]
    if: >-
      always() &&
      needs.unit-tests.result == 'success' &&
      needs.sast.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and push Docker images
        uses: docker/build-push-action@v7.3.0
        with:
          context: services/${{ matrix.service }}
          load: true
          push: false
          tags: local/nexus-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }},ignore-error=true

      - name: Export container image
        run: docker save local/nexus-${{ matrix.service }}:${{ github.sha }} | gzip > image-${{ matrix.service }}.tar.gz

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: image-${{ matrix.service }}
          path: image-${{ matrix.service }}.tar.gz
          retention-days: 1

  validate-image:
    name: Validate container image (${{ matrix.service }})
    needs: build
    if: >-
      always() &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    env:
      IMAGE: local/nexus-${{ matrix.service }}:${{ github.sha }}
      CONTAINER: nexus-smoke-${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download a Build Artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: image-${{ matrix.service }}
          path: .ci-image

      - name: Load container image
        run: gunzip -c .ci-image/image-${{ matrix.service }}.tar.gz | docker load

      - name: Anchore SBOM Action
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json
          artifact-name: sbom-${{ matrix.service }}.spdx.json
          upload-release-assets: false

      - name: Anchore Container Scan
        uses: anchore/scan-action@v7.4.0
        with:
          sbom: sbom-${{ matrix.service }}.spdx.json
          fail-build: true
          only-fixed: true
          severity-cutoff: high
          output-format: table

      - name: Run container smoke test
        run: |
          trap 'docker logs "$CONTAINER" || true; docker rm -f "$CONTAINER" || true' EXIT
          docker run --detach --name "$CONTAINER" --publish 127.0.0.1:18000:8000 "$IMAGE"
          for _ in $(seq 1 15); do
            if curl --fail --silent --show-error http://127.0.0.1:18000/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1
