name: Scan secrets

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan-secrets:
    name: Scan secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
