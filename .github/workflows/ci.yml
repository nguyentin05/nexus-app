name: Application CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.matrix.outputs.any }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Paths Changes Filter
        id: filter
        uses: dorny/paths-filter@v4.0.2
        with:
          filters: |
            auth:
              - 'services/auth-service/**'
              - '.github/workflows/ci.yml'
            profile:
              - 'services/profile-service/**'
              - '.github/workflows/ci.yml'

      - name: Generate service matrix
        id: matrix
        env:
          AUTH_CHANGED: ${{ steps.filter.outputs.auth }}
          PROFILE_CHANGED: ${{ steps.filter.outputs.profile }}
        run: |
          matrix="$(jq -cn --argjson auth "$AUTH_CHANGED" --argjson profile "$PROFILE_CHANGED" '
            {include: [
              if $auth then {service: "auth-service"} else empty end,
              if $profile then {service: "profile-service"} else empty end
            ]}
          ')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any=$([[ "$matrix" == '{\"include\":[]}' ]] && echo false || echo true)" >> "$GITHUB_OUTPUT"

  format-code:
    name: Format changed services
    needs: detect-changes
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.detect-changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.NEXUS_CICD_BOT_TOKEN }}

      - name: astral-sh/setup-uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Format Python code
        env:
          MATRIX: ${{ needs.detect-changes.outputs.matrix }}
        run: |
          while read -r service; do
            uvx ruff format "services/$service"
          done < <(jq -r '.include[].service' <<< "$MATRIX")

      - name: Git Auto Commit
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: "style(project): auto-format Python sources"
          commit_user_name: nexus-cicd-bot
          commit_user_email: ${{ secrets.NEXUS_CICD_BOT_EMAIL }}
          commit_author: nexus-cicd-bot <${{ secrets.NEXUS_CICD_BOT_EMAIL }}>

  scan-secrets:
    name: Scan secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-code:
    name: Lint Python (${{ matrix.service }})
    needs: [detect-changes]
    if: >-
      always() &&
      needs.detect-changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: ruff-action
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: services/${{ matrix.service }}

  lint-dockerfiles:
    name: Lint Dockerfile (${{ matrix.service }})
    needs: [detect-changes]
    if: >-
      always() &&
      needs.detect-changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Hadolint Action
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: services/${{ matrix.service }}/Dockerfile

  unit-tests:
    name: Run unit tests (${{ matrix.service }})
    needs: [detect-changes, scan-secrets, lint-code, lint-dockerfiles]
    if: >-
      always() &&
      needs.detect-changes.outputs.any == 'true' &&
      needs.scan-secrets.result == 'success' &&
      needs.lint-code.result == 'success' &&
      needs.lint-dockerfiles.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: astral-sh/setup-uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run unit tests
        run: uv run python -m pytest tests/

  sast:
    name: Static Application Security Testing
    needs: [detect-changes, scan-secrets, lint-code, lint-dockerfiles]
    if: >-
      always() &&
      needs.detect-changes.outputs.any == 'true' &&
      needs.scan-secrets.result == 'success' &&
      needs.lint-code.result == 'success' &&
      needs.lint-dockerfiles.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.2
        with:
          languages: python
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.2

  build:
    name: Build container image (${{ matrix.service }})
    needs: [detect-changes, unit-tests, sast]
    if: >-
      always() &&
      needs.detect-changes.outputs.any == 'true' &&
      needs.unit-tests.result == 'success' &&
      needs.sast.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and push Docker images
        uses: docker/build-push-action@v7.3.0
        with:
          context: services/${{ matrix.service }}
          load: true
          push: false
          tags: local/nexus-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Export container image
        run: docker save local/nexus-${{ matrix.service }}:${{ github.sha }} | gzip > image-${{ matrix.service }}.tar.gz

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: image-${{ matrix.service }}
          path: image-${{ matrix.service }}.tar.gz
          retention-days: 1

  validate-image:
    name: Validate container image (${{ matrix.service }})
    needs: [detect-changes, build]
    if: >-
      always() &&
      needs.detect-changes.outputs.any == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    env:
      IMAGE: local/nexus-${{ matrix.service }}:${{ github.sha }}
      CONTAINER: nexus-smoke-${{ matrix.service }}
    steps:
      - name: Download a Build Artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: image-${{ matrix.service }}
          path: .ci-image

      - name: Load container image
        run: gunzip -c .ci-image/image-${{ matrix.service }}.tar.gz | docker load

      - name: Anchore SBOM Action
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json
          artifact-name: sbom-${{ matrix.service }}.spdx.json
          upload-release-assets: false

      - name: Anchore Container Scan
        uses: anchore/scan-action@v7.4.0
        with:
          sbom: sbom-${{ matrix.service }}.spdx.json
          fail-build: true
          only-fixed: true
          severity-cutoff: high
          output-format: table

      - name: Run container smoke test
        run: |
          trap 'docker logs "$CONTAINER" || true; docker rm -f "$CONTAINER" || true' EXIT
          docker run --detach --name "$CONTAINER" --publish 127.0.0.1:18000:8000 "$IMAGE"
          for _ in $(seq 1 15); do
            if curl --fail --silent --show-error http://127.0.0.1:18000/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1
